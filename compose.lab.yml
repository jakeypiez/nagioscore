name: nagios-modern-ui-lab

services:
  nagios:
    build:
      context: .
      dockerfile: docker/lab/Dockerfile
    image: nagioscore-modern-ui:lab
    container_name: nagios-modern-ui-lab
    init: true
    ports:
      - "${NAGIOS_LAB_BIND_IP:?Run scripts/nagios-lab up first}:${NAGIOS_LAB_PORT:-8080}:80"
    secrets:
      - lab_username
      - lab_password
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          --user "$$(cat /run/secrets/lab_username):$$(cat /run/secrets/lab_password)"
          http://127.0.0.1/nagios/ >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: "no"

secrets:
  lab_username:
    file: ./.nagios-lab/username
  lab_password:
    file: ./.nagios-lab/password
