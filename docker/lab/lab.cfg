###############################################################################
# Deterministic, disposable monitoring objects for the browser test lab.
###############################################################################

define command {
    command_name    check_lab_state
    command_line    $USER1$/check_dummy $ARG1$ "$ARG2$"
}

define hostgroup {
    hostgroup_name  lab-environment
    alias           Browser Test Lab
}

define host {
    use                     linux-server
    host_name               lab-edge-router
    alias                   Edge Router
    address                 192.0.2.1
    hostgroups              lab-environment
    check_command           check_lab_state!0!Router reachable
    check_interval          1
    retry_interval          1
    max_check_attempts      2
    notifications_enabled   0
}

define host {
    use                     linux-server
    host_name               lab-app-server
    alias                   Application Server
    address                 192.0.2.20
    hostgroups              lab-environment
    check_command           check_lab_state!0!Application host reachable
    check_interval          1
    retry_interval          1
    max_check_attempts      2
    notifications_enabled   0
}

