<!DOCTYPE html>

<html lang="en" class="dark">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="noindex, nofollow">
		<meta name="referrer" content="same-origin">
		<title>JSON Query Generator</title>
		<link rel="stylesheet" type="text/css" href="stylesheets/jsonquery.css"/>
		<link rel="stylesheet" type="text/css" href="stylesheets/theme.css"/>
		<script type="text/javascript" src="js/jquery-3.7.1.min.js" defer></script>
		<script type="text/javascript" src="js/coreui.js" defer></script>
		<script type="text/javascript" src="js/jsonquery.js" defer></script>
	</head>
	<body class="json-query-page">
		<div id="wrap">
			<h1>JSON Query Generator</h1>
			<div id="results" aria-live="polite">
				<p>Your query results will appear here.</p>
			</div>
			<div id="options">
				<p>Choose an API and build a local, authenticated query.</p>
				<form id="query" action="jsonquery.html" method="get">
					<table id="cgiform">
						<tr>
							<td class="label">
								<label for="cginame">CGI</label>
							</td>
							<td>
								<select id="cginame" name="cginame">
									<option value="none">
										Select a CGI
									</option>
									<option value="archivejson.cgi">
										Archive JSON CGI
									</option>
									<option value="objectjson.cgi">
										Object JSON CGI
									</option>
									<option value="statusjson.cgi">
										Status JSON CGI
									</option>
								</select>
							</td>
						</tr>
					</table>
					<button type="submit">Send Query</button>
				</form>
			</div>
		</div>
	</body>
</html>
